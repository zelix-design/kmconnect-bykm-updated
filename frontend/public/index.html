        <!-- ─── FinFlow splash screen ─────────────────────────────────
             Renders BEFORE React mounts so first-load feels instant.
             Hides automatically once the video ends, when the app
             dispatches the `finflow-ready` event, or after a 6.5s timeout.
             Only shown once per browser session (sessionStorage flag).
             The video source is chosen at runtime:
               - `/splash.mp4`         → portal (Super/Office Admin, User, Staff)
               - `/splash-apply.mp4`   → public Student Application form (/apply
                                          on this host, or the public-apply
                                          hostname REACT_APP_PUBLIC_APPLY_HOSTS).
             -->
        <div
            id="finflow-splash"
            aria-hidden="true"
            style="
                position: fixed;
                inset: 0;
                z-index: 2147483647;
                background: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 1;
                transition: opacity 320ms ease;
                pointer-events: none;
            "
        >
            <video
                id="finflow-splash-video"
                autoplay
                muted
                playsinline
                preload="auto"
                poster="%PUBLIC_URL%/km-logo.png"
                style="
                    width: 100%;
                    height: 100%;
                    object-fit: contain;
                    object-position: center;
                    background: #ffffff;
                "
            >
                <!-- src is injected by the script below based on the pathname -->
            </video>
        </div>
        <script>
            (function () {
                var splash = document.getElementById("finflow-splash");
                var video = document.getElementById("finflow-splash-video");
                if (!splash) return;

                // Pick the right splash asset. The Student Application form keeps
                // its original clip; every other route (portal) uses the new one.
                var path = (window.location.pathname || "").toLowerCase();
                var host = (window.location.hostname || "").toLowerCase();
                // Read the public-apply host list injected by CRA (safe fallback: "").
                var applyHostsRaw = "%REACT_APP_PUBLIC_APPLY_HOSTS%";
                // If CRA didn't substitute the token (e.g. served directly), fall back to empty.
                if (applyHostsRaw.indexOf("%") === 0) applyHostsRaw = "";
                var applyHosts = applyHostsRaw
                    .split(",")
                    .map(function (h) { return h.trim().toLowerCase(); })
                    .filter(Boolean);
                var isApplySurface =
                    path === "/apply" ||
                    path.indexOf("/apply/") === 0 ||
                    applyHosts.indexOf(host) !== -1;
                var src = isApplySurface ? "/splash-apply.mp4" : "/splash.mp4";
                // Use a session flag per source so switching hosts still plays
                // the corresponding intro once.
                var seenKey = "finflow_splash_seen_" + (isApplySurface ? "apply" : "portal");

                // Skip the splash if we've shown it once already this session
                // (so route changes / reloads after the first visit don't replay it).
                try {
                    if (sessionStorage.getItem(seenKey)) {
                        splash.remove();
                        return;
                    }
                    // Skip on wide viewports — the portrait splash is built for phones
                    if (window.innerWidth >= 768) {
                        splash.remove();
                        return;
                    }
                } catch (_) { /* sessionStorage disabled — keep playing */ }

                if (video) {
                    var sourceEl = document.createElement("source");
                    sourceEl.src = src;
                    sourceEl.type = "video/mp4";
                    video.appendChild(sourceEl);
                    video.load();
                }

                var dismissed = false;
                function dismiss() {
                    if (dismissed) return;
                    dismissed = true;
                    try { sessionStorage.setItem(seenKey, "1"); } catch (_) {}
                    splash.style.opacity = "0";
                    setTimeout(function () { splash.remove(); }, 360);
                }

                // Hide when the video ends, when React signals readiness, or after timeout
                if (video) {
                    video.addEventListener("ended", dismiss);
                    video.addEventListener("error", dismiss);
                    // If autoplay was blocked (uncommon when muted), fall back to a quick fade
                    var p = video.play && video.play();
                    if (p && typeof p.catch === "function") p.catch(function () { setTimeout(dismiss, 800); });
                }
                window.addEventListener("finflow-ready", dismiss);
                setTimeout(dismiss, 6500);  // hard cap so users are never stuck
            })();
        </script>
